r\n      - recLightboxPanel:\r\n          Control: Classic/Button@2.2.0\r\n          Properties:\r\n            Text: =\"\"\r\n            DisplayMode: =DisplayMode.View\r\n            Visible: =varShowLightbox\r\n            Fill: =RGBA(255,255,255,1)\r\n            HoverFill: =Self.Fill\r\n            PressedFill: =Self.Fill\r\n            BorderThickness: =0\r\n            RadiusTopLeft: =14\r\n            RadiusTopRight: =14\r\n            RadiusBottomLeft: =14\r\n            RadiusBottomRight: =14\r\n            X: =333\r\n            Y: =84\r\n            Width: =700\r\n            Height: =600\r\n      - lblLightboxTitle:\r\n          Control: Label@2.5.1\r\n          Properties:\r\n            Text: |-\r\n              =Switch(varLightboxMode,\r\n                  \"members\", If(IsBlank(varLightboxGroupID), \"\", LookUp(colGroups, ID = varLightboxGroupID).Title),\r\n                  \"history\", If(IsBlank(varLightboxGroupID), \"\", LookUp(colGroups, ID = varLightboxGroupID).Title & \" - History\"),\r\n                  \"batch1\", \"Thursday Batch 1 - recipients\",\r\n                  \"batch2\", \"Thursday Batch 2 - recipients\",\r\n                  \"\"\r\n              )\r\n            Visible: =varShowLightbox\r\n            Color: =RGBA(31,58,95,1)\r\n            FontWeight: =FontWeight.Bold\r\n            Size: =18\r\n            Font: =Font.'Open Sans'\r\n            X: =363\r\n            Y: =110\r\n            Width: =600\r\n            Height: =32\r\n      - icoLightboxClose:\r\n          Control: Classic/Icon@2.5.0\r\n          Properties:\r\n            Icon: =Icon.Cancel\r\n            Visible: =varShowLightbox\r\n            Color: =RGBA(120,120,120,1)\r\n            OnSelect: =Set(varShowLightbox, false)\r\n            X: =983\r\n            Y: =110\r\n            Width: =28\r\n            Height: =28\r\n      - galLightboxMembers:\r\n          Control: Gallery@2.15.0\r\n          Variant: Vertical\r\n          Properties:\r\n                Control: Label@2.5.1\r\n                Properties:\r\n                  Text: =ThisItem.Email\r\n                  Wrap: =false\r\n                  Color: =RGBA(120,120,120,1)\r\n                  Size: =12\r\n                  Font: =Font.'Open Sans'\r\n                  X: =0\r\n                  Y: =28\r\n                  Width: =640\r\n                  Height: =20\r\n      - galLightboxHistory:\r\n          Control: Gallery@2.15.0\r\n          Variant: Vertical\r\n          Properties:\r\n            Items: |-\r\n              =If(\r\n                  varLightboxMode = \"history\" && !IsBlank(varLightboxGroupID),\r\n                  With(\r\n                      {groupTitle: LookUp(colGroups, ID = varLightboxGroupID).Title},\r\n                      Sort(Filter('BM History', Lower(Trim(GroupName)) = Lower(Trim(groupTitle))), Created, SortOrder.Descending)\r\n                  ),\r\n                  Filter('BM History', false)\r\n              )\r\n            Visible: =varShowLightbox && varLightboxMode = \"history\"\r\n            TemplateSize: =40\r\n            TemplatePadding: =0\r\n            X: =363\r\n            Y: =160\r\n            Width: =640\r\n            Height: =480\r\n          Children:\r\n            - lblLightboxHistoryRow:\r\n                Control: Label@2.5.1\r\n                Properties:\r\n                  Text: =ThisItem.Title & \"  \u00b7  \" & Text(ThisItem.Created, \"d mmm yyyy\")\r\n                  Color: =RGBA(50,50,50,1)\r\n                  Size: =13\r\n                  Font: =Font.'Open Sans'\r\n                  X: =0\r\n                  Y: =4\r\n                  Width: =640\r\n                  Height: =32\r\n";
    const stamp = "v2.24  \u2014  Built 29 Jul 2026  17:05 BST";

    function firstLines() {
      return yaml.split(/\r?\n/).slice(0, 8).join('\n');
    }

    async function copyYAML() {
      const status = document.getElementById('status');
      if (!yaml.startsWith('Screens:\r\n  ') && !yaml.startsWith('Screens:\n  ')) {
        status.textContent = 'Refusing to copy: YAML does not start with Screens:';
        status.className = 'err';
        return;
      }
      if (yaml.includes('\r\n    Control: Screen\r\n') || yaml.includes('\n    Control: Screen\n')) {
        status.textContent = 'Refusing to copy: stale YAML still contains screen-level Control: Screen.';
        status.className = 'err';
        return;
      }
      try {
        await navigator.clipboard.writeText(yaml);
        status.textContent = '✓ Copied ' + stamp + '. First YAML line: ' + yaml.split(/\r?\n/)[0];
        status.className = 'ok';
        setTimeout(() => {
          status.textContent = 'Click to copy again';
          status.className = '';
        }, 4000);
      } catch (e) {
        status.textContent = 'Clipboard blocked — select the text below and copy manually.';
        status.className = 'err';
        const pre = document.createElement('pre');
        pre.style = 'font-size:9px;max-height:200px;overflow:auto;background:#1a1a2e;padding:8px;border-radius:6px;text-align:left;';
        pre.textContent = yaml;
        document.body.appendChild(pre);
      }
    }

    document.getElementById('preview').textContent = 'Clipboard payload preview (' + stamp + ')\n' + firstLines();
